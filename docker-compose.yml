version: "3.8"

services:
  web:
    build: .
    container_name: inventrain-web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: lesimple_inventrain
      DB_USER: inventrain
      DB_PASS: inventrain
      ADMIN_PASSWORD_HASH: "$2y$12$pknWzsdr92NZjXzjUHj5k.v3PGlvJjMez2DcoqAPTldpkINf30wlW"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: inventrain-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: lesimple_inventrain
      MYSQL_USER: inventrain
      MYSQL_PASSWORD: inventrain
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
